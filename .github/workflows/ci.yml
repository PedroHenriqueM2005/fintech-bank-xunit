name: CI — Build e Testes (.NET 10)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar o .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Restaurar dependências
        run: dotnet restore

      - name: Compilar (Release, sem rebuild no passo de teste)
        run: dotnet build --configuration Release --no-restore

      - name: Executar testes unitários (xUnit)
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=resultados.trx" --results-directory ./TestResults

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes-${{ matrix.os }}
          path: ./TestResults/**/*.trx
          if-no-files-found: ignore
